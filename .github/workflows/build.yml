name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version name
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SALVAMI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SALVAMI_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build release APKs
        env:
          SALVAMI_KEYSTORE_PASSWORD: ${{ secrets.SALVAMI_KEYSTORE_PASSWORD }}
          SALVAMI_KEY_ALIAS: ${{ secrets.SALVAMI_KEY_ALIAS }}
          SALVAMI_KEY_PASSWORD: ${{ secrets.SALVAMI_KEY_PASSWORD }}
          SALVAMI_VERSION_CODE: ${{ github.run_number }}
        run: |
          # Tag v0.1.0 → 0.1.0; later commits → 0.1.0-3-gabc1234 (commits since the tag, hash)
          described=$(git describe --tags --match 'v*' 2>/dev/null || echo "v0.0.0-g$(git rev-parse --short HEAD)")
          export SALVAMI_VERSION_NAME="${described#v}"
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: salvami-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --generate-notes
